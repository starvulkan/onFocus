<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>onFocus</title>
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span class="blob blob--1"></span>
      <span class="blob blob--2"></span>
      <span class="blob blob--3"></span>
    </div>

    <div id="app">
      <div class="zone zone--tl" id="zone-tl"></div>
      <div class="zone zone--tr" id="zone-tr"></div>

      <main class="stage">
        <img class="lockup" src="./lockup-white.png" alt="onFocus" width="400" />
        <p class="greeting" id="greeting"></p>
        <p class="clock" id="clock">--:--</p>
        <div class="intent-slot" id="intent-slot"></div>
      </main>

      <div class="zone zone--bl" id="zone-bl"></div>
      <div class="zone zone--br" id="zone-br"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
