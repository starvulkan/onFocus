<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>onFocus</title>
  </head>
  <body>
    <div class="photo" id="photo" aria-hidden="true" hidden></div>
    <div class="scrim" id="scrim" aria-hidden="true" hidden></div>

    <div class="aurora" id="aurora" aria-hidden="true">
      <span class="blob blob--1"></span>
      <span class="blob blob--2"></span>
      <span class="blob blob--3"></span>
    </div>

    <div id="app">
      <div class="zone zone--tl" id="zone-tl"></div>
      <div class="zone zone--tr" id="zone-tr">
        <p class="photo-credit" id="photo-credit" hidden></p>
      </div>

      <main class="stage">
        <form class="search" id="search" role="search">
          <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M16.5 16.5 21 21" />
          </svg>
          <input
            class="search__input"
            id="search-input"
            type="search"
            placeholder="Search the web"
            autocomplete="off"
            aria-label="Search the web"
          />
        </form>

        <img class="lockup" src="./lockup-white.png" alt="onFocus" width="400" />
        <p class="greeting" id="greeting"></p>
        <p class="clock" id="clock">--:--</p>

        <div class="focus">
          <input
            class="intent"
            id="intent"
            type="text"
            placeholder="What are you working on?"
            maxlength="80"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="controls">
            <label class="duration" id="duration-wrap">
              <input
                class="duration__input"
                id="duration"
                type="number"
                min="1"
                max="180"
                step="1"
                value="25"
                aria-label="Session length in minutes"
              />
              <span class="duration__unit">min</span>
            </label>
            <button class="btn btn--primary" id="btn-primary" type="button">Start focus</button>
            <button class="btn" id="btn-secondary" type="button" hidden>Give up</button>
          </div>
        </div>
      </main>

      <div class="zone zone--bl" id="zone-bl">
        <button class="btn btn--ghost" id="history-open" type="button">History</button>
        <button class="btn btn--ghost" id="settings-open" type="button">Settings</button>
      </div>
      <div class="zone zone--br" id="zone-br">
        <p class="card stats" id="stats" hidden></p>
      </div>
    </div>

    <dialog class="history" id="history">
      <div class="history__head">
        <h2 class="history__title">Focus history</h2>
        <button class="btn btn--ghost" id="history-close" type="button">Close</button>
      </div>
      <p class="history__summary" id="history-summary"></p>
      <div class="history__list" id="history-list"></div>
      <p class="history__undo" id="history-undo" hidden>
        <span id="history-undo-text"></span>
        <button class="btn btn--ghost" id="history-undo-btn" type="button">Undo</button>
      </p>
    </dialog>

    <dialog class="sheet" id="settings">
      <div class="sheet__head">
        <h2 class="sheet__title">Settings</h2>
        <button class="btn btn--ghost" id="settings-close" type="button">Close</button>
      </div>

      <div class="sheet__row">
        <label class="sheet__label" for="setting-bg">Background</label>
        <select class="field" id="setting-bg">
          <option value="aurora">Aurora Blobs</option>
          <option value="apod">NASA APOD</option>
        </select>
      </div>

      <div class="sheet__row" id="setting-scrim-row" hidden>
        <label class="sheet__label" for="setting-scrim">
          Dimming <span class="sheet__value" id="setting-scrim-value">62%</span>
        </label>
        <input class="field" id="setting-scrim" type="range" min="0" max="100" step="1" value="62" />
      </div>

      <div class="sheet__row">
        <label class="sheet__label" for="setting-engine">Search engine</label>
        <select class="field" id="setting-engine">
          <option value="duckygo">DuckDuckGo</option>
          <option value="google">Google</option>
          <option value="bing">Bing</option>
          <option value="brave">Brave</option>
          <option value="ecosia">Ecosia</option>
          <option value="startpage">Startpage</option>
        </select>
      </div>

      <div class="sheet__row">
        <label class="sheet__label" for="settings-custom">Custom search URL</label>
        <input
          class="field"
          id="setting-custom"
          type="text"
          placeholder="https://example.com/search?q=%s"
          autocomplete="off"
          spellcheck="false"
        />
        <p class="sheet__hint">Must contain <code>%s</code> where the query goes. Else no searching for u...</p>
      </div>
    </dialog>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
